[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mangaba"
version = "4.0.0"
description = "Professional multi-agent AI framework with event-driven flows, ReAct reasoning, RAG, knowledge bases, memory, MCP/A2A interop, and function calling"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Mangaba AI Team", email = "contato@mangaba.ai"}
]
keywords = [
    "ai",
    "gemini",
    "google",
    "chatbot",
    "artificial-intelligence",
    "agent",
    "protocol"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"

# Core install stays small: the OpenAI SDK covers OpenAI, OpenRouter, Ollama and
# every OpenAI-compatible server (vLLM, llama.cpp, LM Studio). The other
# provider SDKs are imported lazily and live in extras.
dependencies = [
    "openai>=1.6.0",
    "pydantic>=2.0.0",
    "python-dotenv>=0.19.0",
    "requests>=2.25.0",
]

[project.scripts]
mangaba = "mangaba.cli.main:main"

[project.optional-dependencies]
google = [
    "google-generativeai>=0.3.0",
]

anthropic = [
    "anthropic>=0.20.0",
]

huggingface = [
    "huggingface-hub>=0.20.0",
]

tokenizer = [
    "tiktoken>=0.5.0",
]

providers = [
    "google-generativeai>=0.3.0",
    "anthropic>=0.20.0",
    "huggingface-hub>=0.20.0",
    "tiktoken>=0.5.0",
]

tools = [
    "duckduckgo-search>=3.9.0",
]

rag = [
    "numpy>=1.24.0",
]

documents = [
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "beautifulsoup4>=4.12.0",
]

yaml = [
    "pyyaml>=6.0",
]

mcp = [
    "mcp>=1.0.0",
]

otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]

langfuse = [
    "langfuse>=2.0.0",
]

mlflow = [
    "mlflow>=2.14.0",
]

phoenix = [
    "arize-phoenix-otel>=0.6.0",
]

observability = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "langfuse>=2.0.0",
    "mlflow>=2.14.0",
    "arize-phoenix-otel>=0.6.0",
]

embeddings = [
    "numpy>=1.24.0",
    "sentence-transformers>=2.2.0",
]

redis = [
    "redis>=5.0.0",
]

postgres = [
    "psycopg[binary]>=3.1.0",
]

chroma = [
    "chromadb>=0.4.0",
]

all = [
    "google-generativeai>=0.3.0",
    "anthropic>=0.20.0",
    "huggingface-hub>=0.20.0",
    "tiktoken>=0.5.0",
    "duckduckgo-search>=3.9.0",
    "numpy>=1.24.0",
    "sentence-transformers>=2.2.0",
    "redis>=5.0.0",
    "psycopg[binary]>=3.1.0",
    "chromadb>=0.4.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0",
]

dev = [
    "loguru>=0.6.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
    "pytest-asyncio>=0.21.1",
    "pytest-xdist>=3.3.1",
    "coverage>=7.2.0",
    "responses>=0.23.0",
    "factory-boy>=3.3.0",
    "faker>=19.0.0",
    "pytest-benchmark>=4.0.0",
    "memory-profiler>=0.61.0",
    "freezegun>=1.2.2",
    "parameterized>=0.9.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "pytest-html>=3.2.0",
    "pytest-json-report>=1.5.0",
    "pytest-github-actions-annotate-failures>=0.2.0",
]

test = [
    "loguru>=0.6.0",
    "google-generativeai>=0.3.0",
    "anthropic>=0.20.0",
    "huggingface-hub>=0.20.0",
    "tiktoken>=0.5.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
    "pytest-asyncio>=0.21.1",
    "pytest-xdist>=3.3.1",
    "coverage>=7.2.0",
]

[project.urls]
Homepage = "https://www.mangaba.ia.br"
"Bug Reports" = "https://github.com/Mangaba-ai/mangaba_ai/issues"
Source = "https://github.com/Mangaba-ai/mangaba_ai"
Documentation = "https://github.com/Mangaba-ai/mangaba_ai#readme"

[tool.hatch.build.targets.wheel]
# Only the framework ships. The repo-root legacy modules (protocols/, utils/,
# mangaba_agent.py) would land as generic top-level names in site-packages.
packages = ["mangaba"]

[tool.uv]
# Configurações específicas para o gerenciador uv

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Coverage is opt-in: `pytest --cov=mangaba --cov-report=term-missing`.
# It used to be forced here with --cov-fail-under=80, but the setting never
# loaded (a stray pytest.ini shadowed this file), and real coverage is ~39% —
# turning it on as-is would have failed every run.
addopts = [
    "--verbose",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
    "--durations=10",
]
markers = [
    "unit: marca testes unitários",
    "integration: marca testes de integração",
    "performance: marca testes de performance",
    "slow: marca testes que demoram para executar",
    "api: marca testes que fazem chamadas de API",
    "network: marca testes que requerem conectividade",
]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/env/*",
    "*/.venv/*",
    "setup.py",
    "conftest.py",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.black]
line-length = 120
target-version = ["py38", "py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | venv
)/
'''

[tool.isort]
profile = "black"
multi_line_mode = 3
line_length = 120
skip = [".gitignore", ".dockerignore"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true

[tool.pylint]
max-line-length = 120
disable = [
    "C0111",  # missing-docstring
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "R0915",  # too-many-statements
]
